server.port=8080

# Configuracion de JPA / Hibernate (Credenciales de MySQL en .env)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT: el secreto se lee de JWT_SECRET (.env). No subir secretos al repositorio.
jwt.secret=${JWT_SECRET:campuslands-ops-local-dev-only-change-me}
jwt.expiration=7200000
jwt.issuer=CampuslandOps.Api
jwt.audience=CampuslandOps.Client

# IA: OpenAI gpt-4o-mini. La clave va en AI_API_KEY (.env), nunca en este archivo.
campus.ai.provider=openai
campus.ai.model=gpt-4o-mini
campus.ai.api-key=${AI_API_KEY:}
